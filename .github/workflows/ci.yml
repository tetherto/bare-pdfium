name: Integrate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  DEPOT_TOOLS_WIN_TOOLCHAIN: 0
jobs:
  security:
    runs-on: ubuntu-latest
    name: Security
    steps:
      - uses: holepunchto/actions/security-base@v1
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/node-base@v1
      - run: npm run lint
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    name: Test / ${{ matrix.platform }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - uses: ./.github/actions/pdfium
        id: pdfium
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          flags: ${{ steps.pdfium.outputs.flags }}
      - run: npm test
  sanitize:
    runs-on: ubuntu-latest
    name: Sanitize / linux
    steps:
      - uses: holepunchto/actions/bare-base@v1
        with:
          source: true
          flags: --debug --sanitize address
      - uses: ./.github/actions/pdfium
        id: pdfium
        with:
          platform: linux
          arch: x64
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          platform: linux
          arch: x64
          flags: --debug --sanitize address ${{ steps.pdfium.outputs.flags }}
      - run: npm test
        env:
          LSAN_OPTIONS: suppressions=test/leaks.txt
