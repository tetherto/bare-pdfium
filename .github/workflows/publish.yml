name: Publish
on:
  push:
    tags:
      - v*
permissions:
  contents: read
env:
  DEPOT_TOOLS_WIN_TOOLCHAIN: 0
jobs:
  prebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: arm64
          - os: ubuntu-24.04
            platform: android
            arch: x64
          - os: ubuntu-24.04
            platform: android
            arch: arm64
          - os: ubuntu-24.04
            platform: android
            arch: arm
          - os: ubuntu-24.04
            platform: android
            arch: ia32
          - os: macos-15
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15
            platform: ios
            arch: arm64
          - os: macos-15
            platform: ios
            arch: arm64
            tags: -simulator
            flags: --simulator
          - os: macos-15
            platform: ios
            arch: x64
            tags: -simulator
            flags: --simulator
          - os: windows-2022
            platform: win32
            arch: x64
          - os: windows-2022
            platform: win32
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: Build / ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - uses: ./.github/actions/pdfium
        id: pdfium
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          tags: ${{ matrix.tags }}
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          flags: ${{ matrix.flags }} ${{ steps.pdfium.outputs.flags }}
          tags: ${{ matrix.tags }}
          upload: true
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    needs: prebuild
    environment:
      name: npm
    name: Publish
    steps:
      - uses: holepunchto/actions/node-base@v1
      - uses: holepunchto/actions/download-prebuilds@v1
      - id: disttag
        run: |
          pushed="${GITHUB_REF_NAME#v}"
          name="$(node -p 'require("./package.json").name')"
          current="$(npm view "$name@latest" version 2>/dev/null || echo 0.0.0)"
          newest="$(printf '%s\n%s\n' "$current" "$pushed" | sort -V | tail -1)"
          if [ "$newest" = "$pushed" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=release-${pushed%.*}" >> "$GITHUB_OUTPUT"
          fi
      - uses: holepunchto/actions/publish@v1
        with:
          tag: ${{ steps.disttag.outputs.tag }}
