name: Publish
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prebuild:
    strategy:
      fail-fast: false
      # Desktop targets for this test publish; the full matrix lives in
      # prebuild.yml. Mobile/win legs are added here once each is validated.
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - os: macos-14
            platform: darwin
            arch: x64
          - os: macos-14
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: Build / ${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          upload: true
  publish:
    runs-on: ubuntu-latest
    needs: prebuild
    permissions:
      contents: read
      packages: write
    name: Publish
    steps:
      - uses: holepunchto/actions/node-base@v1
        with:
          registry-url: https://npm.pkg.github.com
          scope: '@moromisato'
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: holepunchto/actions/download-prebuilds@v1
      - run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
